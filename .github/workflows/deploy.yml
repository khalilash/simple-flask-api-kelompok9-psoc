name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/27288000017/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-devops-kel9-psoc@devops-pso-c-kelompok-9.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t asia-southeast2-docker.pkg.dev/devops-pso-c-kelompok-9/flask-repo/simple-flask-api:${{ github.sha }} .
          docker push asia-southeast2-docker.pkg.dev/devops-pso-c-kelompok-9/flask-repo/simple-flask-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy simple-flask-api \
            --image=asia-southeast2-docker.pkg.dev/devops-pso-c-kelompok-9/flask-repo/simple-flask-api:${{ github.sha }} \
            --region=asia-southeast2 \
            --platform=managed \
            --allow-unauthenticated \
            --project=devops-pso-c-kelompok-9
